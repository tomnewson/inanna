name: Build, test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine build version
        id: build-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            latest_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            if [[ -n "$latest_tag" ]]; then
              released_version=${latest_tag#v}
              if [[ ! "$released_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
                echo "Latest tag $latest_tag is not a supported semantic version." >&2
                exit 1
              fi
              major=${BASH_REMATCH[1]}
              minor=${BASH_REMATCH[2]}
              patch=${BASH_REMATCH[3]}
              version="$major.$minor.$((10#$patch + 1))-ci.$GITHUB_RUN_NUMBER+${GITHUB_SHA::7}"
            else
              version="0.1.0-ci.$GITHUB_RUN_NUMBER+${GITHUB_SHA::7}"
            fi
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Build version $version is not a supported semantic version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET packages
        run: dotnet restore Inanna.slnx

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check .NET formatting
        run: dotnet format Inanna.slnx --verify-no-changes --no-restore

      - name: Run platform-neutral .NET tests
        run: dotnet test Inanna.slnx --no-restore -m:1 --disable-build-servers -warnaserror

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Restore .NET packages
        run: dotnet restore src/dotnet/Inanna.App/Inanna.App.csproj --runtime win-x64

      - name: Run Clippy
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets --target x86_64-pc-windows-msvc --locked

      - name: Build Rust backend
        env:
          INANNA_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --target x86_64-pc-windows-msvc --locked

      - name: Publish Avalonia frontend
        run: >-
          dotnet publish src/dotnet/Inanna.App/Inanna.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:Version=${{ needs.prepare.outputs.version }}
          --output dist/inanna

      - name: Assemble portable application
        shell: pwsh
        run: |
          Remove-Item dist/inanna/*.pdb -ErrorAction SilentlyContinue
          Copy-Item target/x86_64-pc-windows-msvc/release/inanna-backend.exe dist/inanna/
          Copy-Item COPYING,README.md,THIRD_PARTY.md dist/inanna/

      - name: Smoke-test backend protocol
        shell: pwsh
        run: ./scripts/backend-smoke.ps1 dist/inanna/inanna-backend.exe

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/inanna -DestinationPath dist/inanna-windows-x64.zip

      - name: Install Velopack CLI
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download previous Velopack release for delta generation
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }}
          --outputDir dist/velopack

      - name: Build installer and update packages
        if: startsWith(github.ref, 'refs/tags/v')
        # packId and mainExe are stable update identities; packTitle is the brand.
        run: >-
          vpk pack
          --packId yt-dlp-wrapper
          --packVersion ${{ needs.prepare.outputs.version }}
          --packDir dist/inanna
          --mainExe yt-dlp-wrapper.exe
          --packTitle "Inanna"
          --packAuthors "Tom Newson"
          --runtime win-x64
          --icon assets/icons/app-icon.ico
          --outputDir dist/velopack

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          New-Item -ItemType Directory -Force dist/release-assets | Out-Null
          Copy-Item dist/velopack/releases.win.json dist/release-assets/
          Copy-Item "dist/velopack/yt-dlp-wrapper-$version-full.nupkg" dist/release-assets/
          Copy-Item "dist/velopack/yt-dlp-wrapper-$version-delta.nupkg" dist/release-assets/ -ErrorAction SilentlyContinue
          Copy-Item dist/velopack/*-Setup.exe dist/release-assets/Inanna-Installer.exe
          Copy-Item dist/velopack/*-Portable.zip dist/release-assets/Inanna-Portable.zip

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: inanna-windows-x64
          path: dist/inanna-windows-x64.zip
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: inanna-windows-release-assets
          path: dist/release-assets/*
          if-no-files-found: error

  build-macos-arm64:
    needs: prepare
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Select Xcode 26.5
        run: |
          xcode_path=/Applications/Xcode_26.5.app/Contents/Developer
          test -d "$xcode_path"
          echo "DEVELOPER_DIR=$xcode_path" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode_path" xcodebuild -version

      - name: Check and test native Rust code
        run: |
          cargo clippy --all-targets --target aarch64-apple-darwin --locked -- -D warnings
          cargo test --all-targets --target aarch64-apple-darwin --locked

      - name: Build macOS ARM64 application bundle
        env:
          INANNA_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/build-macos-arm64.sh

      - name: Verify native executables and backend protocol
        run: |
          app='dist/macos-arm64/Inanna.app/Contents/MacOS'
          test "$(lipo -archs "$app/yt-dlp-wrapper")" = "arm64"
          test "$(lipo -archs "$app/inanna-backend")" = "arm64"
          ./scripts/backend-smoke.sh "$app/inanna-backend"
          test -f 'dist/macos-arm64/Inanna.app/Contents/Resources/Assets.car'
          codesign --verify --deep --strict 'dist/macos-arm64/Inanna.app'

      - name: Install Velopack CLI
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download previous Velopack release for delta generation
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }}
          --channel osx
          --outputDir dist/velopack

      - name: Build macOS installer and update packages
        if: startsWith(github.ref, 'refs/tags/v')
        # Keep the package ID and entry point stable across the display-name change.
        run: >-
          vpk pack
          --packId yt-dlp-wrapper-macos
          --packVersion ${{ needs.prepare.outputs.version }}
          --packDir "dist/macos-arm64/Inanna.app"
          --mainExe yt-dlp-wrapper
          --packTitle "Inanna"
          --packAuthors "Tom Newson"
          --runtime osx-arm64
          --channel osx
          --signAppIdentity -
          --outputDir dist/velopack

      - name: Verify packaged macOS application
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          portable=$(find dist/velopack -maxdepth 1 -type f -name '*-Portable.zip' -print -quit)
          test -n "$portable"
          verification_dir=$(mktemp -d)
          ditto -x -k "$portable" "$verification_dir"
          packaged_app="$verification_dir/Inanna.app"
          codesign --verify --deep --strict "$packaged_app"
          test "$(lipo -archs "$packaged_app/Contents/MacOS/yt-dlp-wrapper")" = "arm64"
          test "$(lipo -archs "$packaged_app/Contents/MacOS/inanna-backend")" = "arm64"
          test -x "$packaged_app/Contents/MacOS/UpdateMac"
          test -f "$packaged_app/Contents/MacOS/sq.version"
          test -f "$packaged_app/Contents/Resources/Assets.car"

      - name: Stage macOS release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version='${{ needs.prepare.outputs.version }}'
          mkdir -p dist/release-assets
          cp dist/velopack/releases.osx.json dist/release-assets/
          cp "dist/velopack/yt-dlp-wrapper-macos-$version-osx-full.nupkg" dist/release-assets/
          if [[ -f "dist/velopack/yt-dlp-wrapper-macos-$version-osx-delta.nupkg" ]]; then
            cp "dist/velopack/yt-dlp-wrapper-macos-$version-osx-delta.nupkg" dist/release-assets/
          fi
          installer=$(find dist/velopack -maxdepth 1 -type f -name '*.pkg' -print -quit)
          portable=$(find dist/velopack -maxdepth 1 -type f -name '*-Portable.zip' -print -quit)
          test -n "$installer"
          test -n "$portable"
          cp "$installer" dist/release-assets/Inanna-macOS-arm64-Installer.pkg
          cp "$portable" dist/release-assets/Inanna-macOS-arm64-Portable.zip

      - name: Upload macOS ARM64 application
        uses: actions/upload-artifact@v4
        with:
          name: inanna-macos-arm64
          path: dist/macos-arm64/Inanna-macOS-arm64.zip
          if-no-files-found: error

      - name: Upload macOS release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: inanna-macos-release-assets
          path: dist/release-assets/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer and update packages
        uses: actions/download-artifact@v4
        with:
          pattern: inanna-*-release-assets
          merge-multiple: true
          path: dist/release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          download_notes=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            '<!-- user-downloads -->' \
            '## Download for Windows' \
            "**Most users:** [Download the Windows installer]($download_base/Inanna-Installer.exe) and run it." \
            "**Portable use:** [Download the portable ZIP]($download_base/Inanna-Portable.zip), extract it, and run the app without installing it." \
            '## Download for Apple Silicon macOS' \
            "**Most users:** [Download the macOS installer]($download_base/Inanna-macOS-arm64-Installer.pkg) and run it." \
            "**Portable use:** [Download the portable ZIP]($download_base/Inanna-macOS-arm64-Portable.zip), extract it, and move the app to Applications." \
            'The other files are used by automatic updates or contain the source code.')

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

            current_notes=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [[ "$current_notes" != *'<!-- user-downloads -->'* ]]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$download_notes"$'\n\n'"$current_notes"
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/release-assets/* --generate-notes --notes "$download_notes" --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
